name: Weekly Rollup

on:
  schedule:
    # Sundays at 08:00 UK time, after the daily run has stored that day's digest.
    - cron: "0 7 * * 0" # 08:00 BST
    - cron: "0 8 * * 0" # 08:00 GMT
  workflow_dispatch:

concurrency:
  group: weekly-rollup
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Skip duplicate DST run
        id: guard
        run: |
          OFFSET=$(TZ=Europe/London date +%z)
          SCHEDULE="${{ github.event.schedule }}"

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "0 7 * * 0" ] && [ "$OFFSET" = "+0100" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"   # BST cron, and it is BST
          elif [ "$SCHEDULE" = "0 8 * * 0" ] && [ "$OFFSET" = "+0000" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"   # GMT cron, and it is GMT
          else
            echo "Cron '$SCHEDULE' does not match current UK offset '$OFFSET' — this is the off-season entry. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci

      - name: Build weekly rollup
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_TO: ${{ secrets.NEWSLETTER_TO }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm run weekly

      - name: Commit rollup
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Weekly rollup for $(TZ=Europe/London date +%Y-%m-%d)"
            git push
          fi

      - name: Trigger Vercel deploy
        if: steps.guard.outputs.skip != 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK"; fi

      - name: Alert on total failure
        if: failure() && steps.guard.outputs.skip != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -fsS -X POST -H 'Content-Type: application/json' \
              -d "{\"username\":\"Daily Brief\",\"content\":\"Weekly rollup failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$DISCORD_WEBHOOK_URL"
          fi
